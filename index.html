<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8b3a2a">
  <meta name="description" content="ZATY Planner — Franklin-style daily planning system">

  <!-- PWA -->
  <link rel="manifest" href="/manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ZATY">
  <link rel="apple-touch-icon" href="/icon.svg">

  <title>ZATY Planner</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-shell">

  <!-- Top bar -->
  <header class="top-bar">
    <div class="brand">
      <span class="brand-name">ZATY Planner</span>
      <span class="brand-sub">Daily Planning System</span>
    </div>
    <div class="top-actions">
      <button class="install-btn" id="install-btn" aria-label="Install app">
        &#8659; Install
      </button>
      <button class="icon-btn" id="print-btn" aria-label="Print day" title="Print">&#9113;</button>
    </div>
  </header>

  <!-- Date navigation -->
  <div class="date-bar">
    <div class="date-nav-group">
      <button class="nav-btn" id="prev-day" aria-label="Previous day">&#8249;</button>
      <button class="nav-btn" id="next-day" aria-label="Next day">&#8250;</button>
      <button class="today-btn" id="today-btn" aria-label="Go to today">Today</button>
    </div>
    <div id="date-display" aria-live="polite"></div>
  </div>

  <!-- Main content -->
  <main class="planner-body">

    <!-- Most Important (3 manually entered priorities) -->
    <section class="card" aria-label="Most Important Tasks">
      <div class="card-header">
        <span class="card-label">Most Important</span>
        <div class="card-rule"></div>
        <span class="card-hint">Top 3 for today</span>
      </div>
      <div class="mi-list">
        <div class="mi-row">
          <span class="mi-num">1</span>
          <input
            class="mi-input" id="mi-0" type="text"
            placeholder="Your most important task today…"
            maxlength="200" autocomplete="off"
          >
        </div>
        <div class="mi-row">
          <span class="mi-num">2</span>
          <input
            class="mi-input" id="mi-1" type="text"
            placeholder="Second priority…"
            maxlength="200" autocomplete="off"
          >
        </div>
        <div class="mi-row">
          <span class="mi-num">3</span>
          <input
            class="mi-input" id="mi-2" type="text"
            placeholder="Third priority…"
            maxlength="200" autocomplete="off"
          >
        </div>
      </div>
    </section>

    <!-- Task list -->
    <section class="card" aria-label="Task List">
      <div class="card-header">
        <span class="card-label">Tasks</span>
        <div class="card-rule"></div>
      </div>
      <div id="task-list" class="task-list" role="list"></div>
      <div class="add-task-area">
        <button class="add-task-trigger" id="add-task-trigger">+ Add task</button>
        <form class="add-task-form" id="add-task-form" novalidate>
          <div class="add-task-row">
            <input
              class="new-task-input" id="new-task-input" type="text"
              placeholder="Describe the task…"
              maxlength="200" autocomplete="off" required
            >
            <select class="new-task-priority" id="new-task-priority" aria-label="Priority">
              <option value="A">A</option>
              <option value="B" selected>B</option>
              <option value="C">C</option>
            </select>
          </div>
          <div class="add-task-actions">
            <button type="button" class="btn-ghost" id="cancel-add">Cancel</button>
            <button type="submit" class="btn-primary">Add Task</button>
          </div>
        </form>
      </div>
    </section>

    <!-- Notes -->
    <section class="card" aria-label="Daily Notes">
      <div class="card-header">
        <span class="card-label">Notes</span>
        <div class="card-rule"></div>
      </div>
      <div class="notes-wrap">
        <textarea
          id="notes"
          placeholder="Daily notes, ideas, follow-ups…"
          rows="6"
          aria-label="Daily notes"
        ></textarea>
      </div>
    </section>

  </main>

  <!-- Priority legend -->
  <footer class="legend" aria-label="Priority key">
    <div class="legend-item"><span class="legend-dot A"></span>A — Must do</div>
    <div class="legend-item"><span class="legend-dot B"></span>B — Should do</div>
    <div class="legend-item"><span class="legend-dot C"></span>C — Nice to do</div>
  </footer>

</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
